name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install dependencies
        run: gem install xcodeproj --quiet

      - name: Generate Xcode project
        run: ruby generate_project.rb

      - name: Build archive
        run: |
          xcodebuild \
            -project ChessBot.xcodeproj \
            -scheme ChessBot \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/ChessBot.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          ARCHIVE=$PWD/build/ChessBot.xcarchive
          APP_PATH=$(find "$ARCHIVE/Products" -name "*.app" | head -1)
          echo "App found: $APP_PATH"

          # Создаём структуру Payload
          mkdir -p $PWD/build/Payload
          cp -r "$APP_PATH" $PWD/build/Payload/ChessBot.app

          # Добавляем fake entitlements чтобы eSign принял файл
          /usr/libexec/PlistBuddy -c "Add :application-identifier string com.chessbot.app" \
            $PWD/build/Payload/ChessBot.app/Info.plist 2>/dev/null || true

          # Упаковываем
          cd $PWD/build
          zip -qry ChessBot.ipa Payload/
          ls -lh ChessBot.ipa
          echo "Done"

      - name: Verify IPA structure
        run: |
          cd $PWD/build
          unzip -l ChessBot.ipa | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChessBot-IPA
          path: build/ChessBot.ipa
          retention-days: 7
