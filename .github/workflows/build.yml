name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install xcodeproj gem
        run: gem install xcodeproj --quiet

      - name: Generate Xcode project
        run: ruby generate_project.rb

      - name: Build archive
        run: |
          xcodebuild \
            -project ChessBot.xcodeproj \
            -scheme ChessBot \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/ChessBot.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            | xcpretty || true

      - name: Package IPA manually
        run: |
          APP_PATH=$(find $PWD/build/ChessBot.xcarchive -name "*.app" | head -1)
          echo "Found app: $APP_PATH"
          mkdir -p $PWD/build/ipa/Payload
          cp -r "$APP_PATH" $PWD/build/ipa/Payload/
          cd $PWD/build/ipa
          zip -r ChessBot.ipa Payload/
          echo "IPA created successfully"
          ls -lh ChessBot.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChessBot-IPA
          path: build/ipa/ChessBot.ipa
          retention-days: 7
